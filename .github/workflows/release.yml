name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリース作成に必要な権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # npm ci を使用することで、package-lock.json と完全に一致する依存関係を高速インストールします
        run: npm ci

      - name: Build the extension
        run: npm run build

      - name: Package to ZIP
        run: |
          cd dist
          zip -r ../ghost-echo-extension.zip ./*
          cd ..

      - name: Upload Artifact
        # GitHub Actionsの「Artifacts」にZIPを保存（ページ上からダウンロード可能に）
        uses: actions/upload-artifact@v4
        with:
          name: ghost-echo-extension
          path: ghost-echo-extension.zip

      - name: Create Release
        # GitHubの「Releases」に自動的にファイルをアップロードしてリリースを作成
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ghost-echo-extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
